[package]
name = "solana-validator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
solana-system-interface = { version = "3.1.0", features = ["bincode"] }
solana-account = { version = "4.1.0", features = ["bincode"] }
rand = "0.10.0"
bs58 = "0.5.1"
solana-transaction = { version = "4.0.0", features = ["serde"] }
